[files]
extend-exclude = [
    "changelog.d/pr-11501.md",
    "changelog.d/pr-11602.md",
    "changelog.d/pr-11621.md",
]

[default]
extend-ignore-re = [
    "(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
]

[default.extend-words]
# Extinguish false positive in cabal-package-description-file.rst. 'Nd' is a
# Unicode category, not a misspelling of 'And'.
nd = "nd"
certifi = "certifi" # Python package name
# ELF relocation section name prefix ('.rela.text', '.rela.data', …);
# referenced in examples/link-cache-demo/PLAN-canonical-object-hash.md.
rela = "rela"
# DWARF debug section name ('.debug_aranges'); same doc.
aranges = "aranges"
